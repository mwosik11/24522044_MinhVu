<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A resilient landing page with a UTC countdown and accessible registration form.">
  <title>Resilient Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content">Skip to main content</a>

  <header>
    <h1>Something Great Is Coming</h1>
    <p>Stay informed and be ready for the launch.</p>
  </header>

  <main id="main-content">
    <section aria-labelledby="countdown-heading">
      <h2 id="countdown-heading">Launch Countdown</h2>

      <div
        id="countdown"
        data-countdown-target="2026-12-31T17:00:00Z"
        aria-label="Time remaining until launch"
      >
        <div>
          <span data-unit="days">--</span>
          <span>Days</span>
        </div>

        <div>
          <span data-unit="hours">--</span>
          <span>Hours</span>
        </div>

        <div>
          <span data-unit="minutes">--</span>
          <span>Minutes</span>
        </div>

        <div>
          <span data-unit="seconds">--</span>
          <span>Seconds</span>
        </div>
      </div>

      <p id="countdown-status" role="status" aria-live="polite">
        Countdown is waiting to start.
      </p>
    </section>
  </main>
</body>
</html>
